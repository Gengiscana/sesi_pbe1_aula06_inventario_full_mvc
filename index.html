<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário</title>
</head>

<body>
    <header></header>
    <main>
        <section>
            <form action="http://localhost:3000/bens" method="post">
                <input type="text" name="item" placeholder="Nome do item" required>
                <input type="text" name="item" placeholder="Nome do item" required>
                <input type="text" name="local" placeholder="Local do item" required>
                <input type="date" name="data" placeholder="Data do item" required>
                <input type="number" step="0.01" name="valor" placeholder="Valor do item" required>
                <input type="text" name="patrimonio" placeholder="Nº do patrimonio" required>
                <input type="submit" value="Enviar">
            </form>
        </section>
        <section>
            <table>
                <tbody>
                    <tr>
                        <th>Item</th>
                        <th>Local</th>
                        <th>Data</th>
                        <th>Valor</th>
                        <th>Patrimonio</th>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer></footer>
</body>

</html>
